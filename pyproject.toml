[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "retico-respeakermic"
dynamic = ["version"]
description = "ReSpeaker microphone array modules for the retico framework: audio with direction of arrival (DOA), DOA-based speaker diarization, and per-speaker audio splitting."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    {name = "Cheikh Lame", email = "cheikhlame@u.boisestate.edu"},
    {name = "Drew McMains", email = "andrewmcmains@u.boisestate.edu"},
]
dependencies = [
    "retico-core>=2.0.0",
    "python-socketio==4.6.1",
    "python-engineio==3.14.2",
]
keywords = ["retico", "respeaker", "microphone array", "doa", "diarization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Repository = "https://github.com/retico-team/retico-respeakermic"

[tool.setuptools_scm]
version_file = "retico_respeakermic/version.py"
